  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:      #06111F;
      --navy-1:    #0B1D33;
      --cyan:      #00C2FF;
      --cyan-soft: #33CFFF;
      --cyan-dim:  #0096C7;
      --white:     #FFFFFF;
      --gray-2:    #7A9CC5;
    }

    html, body {
      height: 100%;
      font-family: 'Instrument Sans', sans-serif;
      background: var(--navy);
      color: var(--white);
      overflow-x: hidden;
    }

    /* ── Animated background ── */
    .bg-layer {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 80% 60% at 50% -10%, rgba(0,194,255,0.12) 0%, transparent 65%),
        radial-gradient(ellipse 50% 40% at 80% 90%, rgba(0,194,255,0.06) 0%, transparent 60%);
    }
    .grid-overlay {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image:
        linear-gradient(rgba(0,194,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,194,255,0.04) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 30%, transparent 80%);
    }

    /* ── Page layout ── */
    .page {
      position: relative; z-index: 1;
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 40px 24px;
      text-align: center;
    }

    /* ── Logo ── */
    .logo-wrap {
      position: absolute; top: 32px; left: 50%;
      transform: translateX(-50%);
    }
    .logo-wrap img { height: 32px; width: auto; }

    /* ── 404 number ── */
    .error-code {
      font-size: clamp(120px, 22vw, 240px);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, rgba(0,194,255,0.9) 0%, rgba(0,194,255,0.25) 60%, transparent 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0;
      user-select: none;
      animation: fadeUp 0.7s cubic-bezier(0.16,1,0.3,1) both;
    }

    /* ── Divider line ── */
    .divider {
      width: 60px; height: 2px;
      background: linear-gradient(90deg, transparent, var(--cyan), transparent);
      margin: 16px auto 28px;
      animation: fadeUp 0.7s 0.1s cubic-bezier(0.16,1,0.3,1) both;
    }

    .error-label {
      font-size: 11px; font-weight: 800; letter-spacing: 0.14em;
      text-transform: uppercase; color: rgba(0,194,255,0.6);
      margin-bottom: 14px;
      animation: fadeUp 0.7s 0.15s cubic-bezier(0.16,1,0.3,1) both;
    }
    .error-title {
      font-size: clamp(24px, 4vw, 38px);
      font-weight: 800; line-height: 1.15;
      letter-spacing: -0.025em;
      color: var(--white);
      margin-bottom: 14px;
      animation: fadeUp 0.7s 0.2s cubic-bezier(0.16,1,0.3,1) both;
    }
    .error-sub {
      font-size: clamp(14px, 1.6vw, 16px);
      color: rgba(255,255,255,0.5);
      max-width: 420px;
      line-height: 1.7;
      margin: 0 auto 40px;
      animation: fadeUp 0.7s 0.25s cubic-bezier(0.16,1,0.3,1) both;
    }

    /* ── Actions ── */
    .actions {
      display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;
      animation: fadeUp 0.7s 0.32s cubic-bezier(0.16,1,0.3,1) both;
    }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 26px; border-radius: 9px;
      font-family: 'Instrument Sans', sans-serif;
      font-size: 14px; font-weight: 700;
      text-decoration: none; transition: all 0.22s ease;
      white-space: nowrap; cursor: pointer; border: none;
    }
    .btn-cyan {
      background: var(--cyan); color: var(--navy);
      box-shadow: 0 4px 20px rgba(0,194,255,0.35);
    }
    .btn-cyan:hover {
      background: var(--cyan-soft);
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(0,194,255,0.5);
    }
    .btn-outline {
      background: transparent; color: rgba(255,255,255,0.75);
      border: 1.5px solid rgba(255,255,255,0.2);
    }
    .btn-outline:hover {
      border-color: rgba(255,255,255,0.5);
      color: var(--white);
      background: rgba(255,255,255,0.06);
    }
    .btn-whatsapp {
      background: #25D366; color: #fff;
      box-shadow: 0 4px 16px rgba(37,211,102,0.3);
    }
    .btn-whatsapp:hover {
      background: #1ebe5a;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(37,211,102,0.45);
    }

    /* ── Quick links ── */
    .quick-links {
      margin-top: 52px;
      animation: fadeUp 0.7s 0.4s cubic-bezier(0.16,1,0.3,1) both;
    }
    .quick-links-label {
      font-size: 11px; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase; color: rgba(255,255,255,0.25);
      margin-bottom: 16px;
    }
    .quick-links-grid {
      display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
    }
    .quick-link {
      font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.45);
      text-decoration: none; padding: 7px 16px; border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.1);
      transition: all 0.2s;
    }
    .quick-link:hover {
      color: var(--cyan); border-color: rgba(0,194,255,0.35);
      background: rgba(0,194,255,0.06);
    }

    /* ── Animations ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Auto-redirect countdown ── */
    .redirect-note {
      margin-top: 32px;
      font-size: 12px; color: rgba(255,255,255,0.2);
      animation: fadeUp 0.7s 0.5s cubic-bezier(0.16,1,0.3,1) both;
    }
    #countdown { color: rgba(0,194,255,0.5); font-weight: 700; }

  <!-- Quick links -->

  <!-- Countdown -->
  <p class="redirect-note">
    Redirecting to home in <span id="countdown">10</span>s
  </p>

</div>

<script>
  /* Countdown redirect */
  var n = 10;
  var el = document.getElementById('countdown');
  var timer = setInterval(function () {
    n--;
    if (el) el.textContent = n;
    if (n <= 0) {
      clearInterval(timer);
      window.location.href = '/';
    }
  }, 1000);

  /* Cancel redirect on any user interaction */
  ['click', 'keydown', 'mousemove', 'touchstart'].forEach(function(evt) {
    document.addEventListener(evt, function() {
      clearInterval(timer);
      var note = document.querySelector('.redirect-note');
      if (note) note.style.display = 'none';
    }, { once: true });
  });
</script>
